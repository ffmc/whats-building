* { box-sizing: border-box; }
body {

.takeaway { color: var(--text-secondary); margin: 0 0 24px; max-width: 62ch; }

figure {
  margin: 0;

  border-radius: 10px;
  padding: 20px 20px 14px;
}
figcaption { font-size: 13px; color: var(--muted); margin-top: 12px; }
svg { display: block; width: 100%; height: auto; overflow: visible; }

.hero {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 32px;
  display: flex;
  gap: 32px;
  flex-wrap: wrap;
  align-items: baseline;
}
.hero-fig { font-size: clamp(52px, 11vw, 88px); line-height: 1; font-weight: 650; letter-spacing: -0.03em; color: var(--text-primary); }
.hero-label { font-size: 16px; color: var(--text-secondary); max-width: 40ch; }
.hero-sub { flex: 1 1 260px; }

.axis-label, .tick { font-size: 12px; fill: var(--muted); }
.bar-value { font-size: 12px; fill: var(--text-secondary); }
.gridline { stroke: var(--grid); stroke-width: 1; }
.baseline { stroke: var(--axis); stroke-width: 1; }

.tooltip {
  position: fixed;
  pointer-events: none;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 11px;
  font-size: 13px;
  line-height: 1.45;
  color: var(--text-primary);
  box-shadow: 0 4px 16px rgba(0,0,0,0.16);
  opacity: 0;
  transition: opacity .12s;
  z-index: 10;
  white-space: nowrap;
}
.tooltip strong { font-weight: 600; }
.tooltip .t-sub { color: var(--text-secondary); }

details { margin-top: 14px; }
summary {
  cursor: pointer;
  font-size: 13px;
  color: var(--text-secondary);
  padding: 4px 0;
}
summary:hover { color: var(--text-primary); }
table { border-collapse: collapse; width: 100%; margin-top: 10px; font-size: 13px; }
th, td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--grid); }
th { color: var(--text-secondary); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

.caveats { margin-top: 72px; padding-top: 28px; border-top: 1px solid var(--border); }
.caveats h2 { font-size: 20px; }
.caveats p, .caveats li { color: var(--text-secondary); font-size: 15px; }
.caveats li { margin-bottom: 10px; }
.note {
  border-left: 3px solid var(--series-2);
  padding: 2px 0 2px 14px;
  margin: 20px 0;
  color: var(--text-secondary);
  font-size: 15px;
}
.loading { color: var(--muted); padding: 40px 0; }

<script>
const F = new Intl.NumberFormat('en-US');
const tip = document.getElementById('tip');

function showTip(html, e) {
  tip.innerHTML = html;
  tip.style.opacity = '1';
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY - r.height - 10;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y < 8) y = e.clientY + 18;
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
}
const hideTip = () => tip.style.opacity = '0';

const el = (tag, attrs = {}, kids = []) => {
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  for (const c of [].concat(kids)) n.append(c);
  return n;
};

function niceMax(v) {
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  return Math.ceil(v / p * 2) / 2 * p;
}

/* Horizontal ranked bars: identity + magnitude. Single series, so no legend —
   the section title names it. Value labels are always visible (the relief rule). */
function barChart(rows, { unit = '', width = 840, labelW = 150, barH = 26, gap = 9 } = {}) {
  const max = niceMax(Math.max(...rows.map(r => r[1])));
  const plotW = width - labelW - 62;
  const height = rows.length * (barH + gap) - gap;
  const svg = el('svg', { viewBox: `0 0 ${width} ${height + 26}`, role: 'img' });

  for (let i = 0; i <= 4; i++) {
    const x = labelW + plotW * i / 4;
    svg.append(el('line', { x1: x, y1: 0, x2: x, y2: height, class: 'gridline' }));
    svg.append(el('text', { x, y: height + 18, class: 'tick', 'text-anchor': 'middle' },
      [document.createTextNode(F.format(Math.round(max * i / 4)))]));
  }

  rows.forEach((r, i) => {
    const y = i * (barH + gap);
    const w = Math.max(2, plotW * r[1] / max);
    svg.append(el('text', { x: labelW - 10, y: y + barH / 2 + 4, class: 'bar-value',
      'text-anchor': 'end', fill: 'var(--text-primary)' }, [document.createTextNode(r[0])]));
    const bar = el('rect', { x: labelW, y, width: w, height: barH, rx: 4,
      fill: r[2] || 'var(--series-1)' });
    const pct = (100 * r[1] / rows.reduce((s, q) => s + q[1], 0)).toFixed(1);
    bar.addEventListener('mousemove', e => showTip(
      `<strong>${r[0]}</strong><br><span class="t-sub">${F.format(r[1])} ${unit} · ${pct}% of shown</span>`, e));
    bar.addEventListener('mouseleave', hideTip);
    svg.append(bar);
    svg.append(el('text', { x: labelW + w + 8, y: y + barH / 2 + 4, class: 'bar-value' },
      [document.createTextNode(F.format(r[1]))]));
  });
  return svg;
}

/* Line for change-over-time. Single series → no legend. Partial periods get a
   hollow marker so a truncated window never reads as a real decline. */
function lineChart(pts, { width = 840, height = 300, yMax, yFmt = v => v, tipFmt } = {}) {
  const L = 52, R = 16, T = 14, B = 34;
  const max = yMax ?? niceMax(Math.max(...pts.map(p => p.y)));
  const plotW = width - L - R, plotH = height - T - B;
  const X = i => L + (pts.length === 1 ? plotW / 2 : plotW * i / (pts.length - 1));
  const Y = v => T + plotH * (1 - v / max);
  const svg = el('svg', { viewBox: `0 0 ${width} ${height}`, role: 'img' });

  for (let i = 0; i <= 4; i++) {
    const y = T + plotH * i / 4, v = max * (1 - i / 4);
    svg.append(el('line', { x1: L, y1: y, x2: width - R, y2: y, class: 'gridline' }));
    svg.append(el('text', { x: L - 10, y: y + 4, class: 'tick', 'text-anchor': 'end' },
      [document.createTextNode(yFmt(v))]));
  }
  svg.append(el('line', { x1: L, y1: T + plotH, x2: width - R, y2: T + plotH, class: 'baseline' }));

  svg.append(el('path', {
    d: pts.map((p, i) => `${i ? 'L' : 'M'}${X(i)},${Y(p.y)}`).join(' '),
    fill: 'none', stroke: 'var(--series-1)', 'stroke-width': 2,
    'stroke-linejoin': 'round', 'stroke-linecap': 'round'
  }));

  pts.forEach((p, i) => {
    if (p.label !== false)
      svg.append(el('text', { x: X(i), y: height - 12, class: 'tick', 'text-anchor': 'middle' },
        [document.createTextNode(p.x)]));
    const dot = el('circle', {
      cx: X(i), cy: Y(p.y), r: 5,
      fill: p.partial ? 'var(--surface-1)' : 'var(--series-1)',
      stroke: 'var(--series-1)', 'stroke-width': 2
    });
    svg.append(dot);
    const hit = el('circle', { cx: X(i), cy: Y(p.y), r: 16, fill: 'transparent' });
    hit.addEventListener('mousemove', e => showTip(tipFmt(p), e));
    hit.addEventListener('mouseleave', hideTip);
    svg.append(hit);
  });
  return svg;
}

/* Dense monthly series: bars, because 60 points of line with markers is mush.
   March bars take slot 2 to carry the seasonal point without a second axis. */
function monthBars(rows, { width = 840, height = 260 } = {}) {
  const L = 52, R = 8, T = 14, B = 30;
  const max = niceMax(Math.max(...rows.map(r => r[1])));
  const plotW = width - L - R, plotH = height - T - B;
  const bw = plotW / rows.length;
  const svg = el('svg', { viewBox: `0 0 ${width} ${height}`, role: 'img' });

  for (let i = 0; i <= 4; i++) {
    const y = T + plotH * i / 4;
    svg.append(el('line', { x1: L, y1: y, x2: width - R, y2: y, class: 'gridline' }));
    svg.append(el('text', { x: L - 10, y: y + 4, class: 'tick', 'text-anchor': 'end' },
      [document.createTextNode(F.format(Math.round(max * (1 - i / 4))))]));
  }

  rows.forEach(([m, n], i) => {
    const isMar = m.endsWith('-03');
    const h = Math.max(1, plotH * n / max);
    const bar = el('rect', {
      x: L + i * bw + 1, y: T + plotH - h, width: Math.max(1, bw - 2), height: h, rx: 2,
      fill: isMar ? 'var(--series-2)' : 'var(--series-1)',
      opacity: isMar ? 1 : 0.55
    });
    bar.addEventListener('mousemove', e => showTip(
      `<strong>${m}</strong><br><span class="t-sub">${F.format(n)} repos${isMar ? ' · March' : ''}</span>`, e));
    bar.addEventListener('mouseleave', hideTip);
    svg.append(bar);
    if (m.endsWith('-01'))
      svg.append(el('text', { x: L + i * bw + bw / 2, y: height - 10, class: 'tick',
        'text-anchor': 'middle' }, [document.createTextNode(m.slice(0, 4))]));
  });
  svg.append(el('line', { x1: L, y1: T + plotH, x2: width - R, y2: T + plotH, class: 'baseline' }));
  return svg;
}

function table(headers, rows) {
  const d = document.createElement('details');
  d.innerHTML = `<summary>Show data table</summary><table><thead><tr>${
    headers.map((h, i) => `<th${i ? ' class="num"' : ''}>${h}</th>`).join('')
  }</tr></thead><tbody>${
    rows.map(r => `<tr>${r.map((c, i) =>
      `<td${i ? ' class="num"' : ''}>${typeof c === 'number' ? F.format(c) : c}</td>`).join('')}</tr>`).join('')
  }</tbody></table>`;
  return d;
}

function section(title, takeaway, chart, caption, tbl) {
  const s = document.createElement('section');
  s.innerHTML = `<h2>${title}</h2><p class="takeaway">${takeaway}</p>`;
  const fig = document.createElement('figure');
  fig.append(chart);
  if (caption) {
    const c = document.createElement('figcaption');
    c.textContent = caption;
    fig.append(c);
  }
  s.append(fig);
  if (tbl) s.append(tbl);
  return s;
}

// dim_taxonomy carries the display labels ("AI Agents & MCP"); slug-casing them
// locally would produce "Ai Agents Mcp".
let TAX = { category: {}, domain: {} };
const label = (axis, slug) => TAX[axis][slug]?.label
  || slug.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

Promise.resolve([window.__DATA__.summary, window.__DATA__.taxonomy]).then(([d, tax]) => {
  TAX = tax;
  const root = document.getElementById('content');
  root.className = '';
  root.innerHTML = '';

  const months = Object.entries(d.created_by_month).sort();
  const first = months[0][0], last = months[months.length - 1][0];
  document.getElementById('scope').textContent =
    `${F.format(d.total_repos)} repositories · created ${first} to ${last} · ≥50 stars · snapshot 2026-07-21`;

  const ai = d.ai_by_year;
  const latest = ai[ai.length - 1], base = ai[0];

  // Hero: one number, no plot. The headline is a magnitude, not a shape.
  const hero = document.createElement('div');
  hero.className = 'hero';
  hero.innerHTML = `
    <div><div class="hero-fig">${latest.pct}%</div></div>
    <div class="hero-sub"><div class="hero-label">of repositories created in ${latest.year} are AI-related —
    up from <strong>${base.pct}%</strong> in ${base.year}. The inflection lands on 2023, the first full year after ChatGPT.</div></div>`;
  root.append(hero);

  root.append(section(
    'AI went from a niche to half of everything',
    `The share of new popular repositories that build on or provide AI functionality nearly quadrupled in five years. The jump between 2022 and 2023 — ${ai[1].pct}% to ${ai[2].pct}% — is the single largest year-over-year move in the dataset.`,
    lineChart(ai.map(r => ({ x: r.year, y: r.pct, partial: r.partial, ...r })), {
      yMax: 60, yFmt: v => v.toFixed(0) + '%',
      tipFmt: p => `<strong>${p.x}</strong><br><span class="t-sub">${p.pct}% AI-related<br>${F.format(p.ai)} of ${F.format(p.total)} repos${p.partial ? '<br>partial year' : ''}</span>`
    }),
    'Hollow markers are partial years: 2021 begins 19 July, 2026 ends 21 July at the snapshot date.',
    table(['Year', 'Repos', 'AI-related', '% AI'],
      ai.map(r => [r.year + (r.partial ? ' *' : ''), r.total, r.ai, r.pct + '%']))
  ));

  const cats = Object.entries(d.by_category).filter(([k]) => k !== 'unclassified')
    .sort((a, b) => b[1] - a[1]);
  root.append(section(
    'Most of it is plumbing',
    `Libraries and SDKs alone account for one in four repositories — more than web apps, CLI tools and dev tooling combined. The picture of open source as finished products people run is wrong; it is overwhelmingly parts other software is built from.`,
    barChart(cats.map(([k, v]) => [label('category', k), v]), { unit: 'repos' }),
    'Category = the form a repository takes, independent of its subject.',
    table(['Category', 'Repos'], cats.map(([k, v]) => [label('category', k), v]))
  ));

  const doms = Object.entries(d.by_domain).filter(([k]) => !['unclassified', 'unknown', 'other'].includes(k))
    .sort((a, b) => b[1] - a[1]).slice(0, 12);
  root.append(section(
    'What it is about',
    `AI agents and MCP is the single largest subject area — a category that essentially did not exist three years ago. Together the three AI-adjacent domains outweigh any traditional field.`,
    barChart(doms.map(([k, v]) => [label('domain', k), v]), { unit: 'repos', labelW: 175 }),
    'Top 12 domains. Excludes “unknown” and “other”.',
    table(['Domain', 'Repos'], doms.map(([k, v]) => [label('domain', k), v]))
  ));

  const marchRows = months.filter(([m]) => m.endsWith('-03'));
  root.append(section(
    'Every March, a spike',
    `March produces about 20% more repositories per day than the yearly average, five years running, across every category and both individual and organisation accounts. The effect is strongest in model and dataset releases, which fits the spring conference cycle — though the data can show the pattern, not its cause.`,
    monthBars(months),
    'Repositories by creation month. March highlighted. The 2026 tail falls off because the window closes at the snapshot date.',
    table(['March', 'Repos'], marchRows.map(([m, n]) => [m, n]))
  ));

  root.append(section(
    'Popularity is brutally top-heavy',
    `Nearly half of everything here sits between 50 and 99 stars, and only ${((d.star_buckets[6][1] / d.total_repos) * 100).toFixed(1)}% ever clears 10,000. Because the sample already requires 50 stars, this is the tail of the tail — the true distribution across all of GitHub is far steeper.`,
    barChart(d.star_buckets.map(([k, v]) => [k, v]), { unit: 'repos', labelW: 88 }),
    'Star counts at the 2026-07-21 snapshot.',
    table(['Stars', 'Repos'], d.star_buckets)
  ));

  const langs = Object.entries(d.by_language).filter(([k]) => k !== 'unknown')
    .sort((a, b) => b[1] - a[1]).slice(0, 12);
  root.append(section(
    'Python won the boom',
    `Python leads TypeScript by more than two to one. Given how much of the corpus is AI-related, this is less a statement about language design than about where the AI ecosystem settled.`,
    barChart(langs.map(([k, v]) => [k, v]), { unit: 'repos', labelW: 130 }),
    'Primary language as reported by GitHub. Repositories with no detected language are excluded.',
    table(['Language', 'Repos'], langs)
  ));

  const c = document.createElement('div');
  c.className = 'caveats';
  c.innerHTML = `
    <h2>How to read this</h2>
    <p>Every number above describes <strong>repositories that became popular</strong>, not all software written. That distinction changes what most of these charts mean.</p>
    <ul>
      <li><strong>The sample is trending repos.</strong> Discovery requires 50+ stars, which structurally overrepresents tooling that developers themselves adopt — and, in this period, AI tooling about AI tooling. The direction of the AI trend is far too large to be an artifact, but its level is inflated.</li>
      <li><strong>Recent years are biased upward by survivorship.</strong> A repository created in 2026 had months, not years, to reach 50 stars, so only fast growers qualify. AI repositories currently grow fastest. Treat 2021–2024 as the trustworthy stretch of the curve.</li>
      <li><strong>Classification is machine-generated.</strong> Each repository was labelled by Claude Haiku 4.5 from its name, description, language and topics — not its code. ${(100 * (d.confidence.high || 0) / d.total_repos).toFixed(0)}% of labels carry high confidence (≥0.8).</li>
      <li><strong>About 10% of repositories cannot be classified at all</strong> — they have no description and no topics, leaving nothing to judge but a name. They are kept in the totals and shown as “unknown” rather than quietly dropped.</li>
      <li><strong>Stars are a popularity proxy, not a quality one.</strong> Nothing here measures whether a project is good, maintained, or worth your time.</li>
    </ul>
    <p class="note">Metrics are a single snapshot taken 21 July 2026, so this page describes composition, not momentum. Once weekly snapshots accumulate, the more interesting question — what is growing fastest right now — becomes answerable.</p>
    <p style="font-size:14px;color:var(--muted);margin-top:28px">Data: GitHub Search and GraphQL APIs. Classification: Claude Haiku 4.5. Source and method: <code>README.md</code>.</p>`;
  root.append(c);
}).catch(e => {
  document.getElementById('content').innerHTML =
    `<p class="loading">Could not load <code>data/summary.json</code> — run <code>python3 aggregate.py</code>, then serve this directory over HTTP (<code>python3 -m http.server</code>). Opening the file directly will not work.<br><br>${e}</p>`;
});
</script>
</body>
</html>
