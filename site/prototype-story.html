<!doctype html>
<!--
  PROTOTYPE — throwaway. Answers: "what should the story→explorer page look
  like?" Three structurally different variants, switch via ?variant=A|B|C or
  the floating bar. Uses real data from data/*.json. Not linked from index.html.
  Serve with `python3 -m http.server` from site/ (fetch needs http://, not file://).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — story/explorer</title>
<style>
:root {
  color-scheme: light;
  --surface-1: #fcfcfb;
  --plane: #f9f9f7;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --ai: #eb6834;
  --nonai: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1: #1a1a19; --plane: #0d0d0d; --text-primary: #fff;
    --text-secondary: #c3c2b7; --muted: #898781; --grid: #2c2c2a;
    --axis: #383835; --border: rgba(255,255,255,0.10);
    --series-1: #3987e5; --series-2: #d95926; --ai: #d95926; --nonai: #3987e5;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--plane); color: var(--text-primary);
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis-label, .tick { font-size: 12px; fill: var(--muted); }
.bar-value { font-size: 12px; fill: var(--text-secondary); }
.gridline { stroke: var(--grid); stroke-width: 1; }
.baseline { stroke: var(--axis); stroke-width: 1; }
.tooltip { position: fixed; pointer-events: none; background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 11px;
  font-size: 13px; line-height: 1.45; box-shadow: 0 4px 16px rgba(0,0,0,.16);
  opacity: 0; transition: opacity .12s; z-index: 20; white-space: nowrap; }
.tooltip strong { font-weight: 600; }
.tooltip .t-sub { color: var(--text-secondary); }
.loading { color: var(--muted); padding: 60px 20px; font-size: 15px; }

/* ---------- prototype switcher (not part of any design) ---------- */
#switcher {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px;
  background: #111; color: #fff; border-radius: 999px; padding: 8px 6px 8px 14px;
  font: 13px/1 system-ui, sans-serif; box-shadow: 0 6px 24px rgba(0,0,0,.35);
  z-index: 1000; border: 1px solid rgba(255,255,255,.15);
}
#switcher button { background: rgba(255,255,255,.12); color: #fff; border: none;
  border-radius: 999px; width: 26px; height: 26px; cursor: pointer; font-size: 14px; }
#switcher button:hover { background: rgba(255,255,255,.25); }
#switcher .label { min-width: 190px; text-align: center; }
#switcher .label b { color: #ffd479; }

/* ================= VARIANT A — cinematic scroll ================= */
.v-a .story { position: relative; }
.v-a .pin-wrap { height: 300vh; position: relative; }
.v-a .pin { position: sticky; top: 0; height: 100vh; display: flex;
  align-items: center; justify-content: center; overflow: hidden; }
.v-a .pin-chart { width: min(760px, 86vw); }
.v-a .beat { position: absolute; inset: 0; display: flex; align-items: center;
  justify-content: center; pointer-events: none; }
.v-a .beat-text { max-width: 620px; text-align: center; padding: 0 24px;
  font-size: clamp(22px, 3.4vw, 34px); font-weight: 600; letter-spacing: -0.01em;
  opacity: 0; transform: translateY(18px); transition: opacity .5s, transform .5s;
  background: color-mix(in srgb, var(--plane) 78%, transparent);
  backdrop-filter: blur(2px); border-radius: 14px; padding: 18px 22px; }
.v-a .beat-text em { color: var(--ai); font-style: normal; }
.v-a .beat.active .beat-text { opacity: 1; transform: translateY(0); }
.v-a .beat[data-pos="top"] { align-items: flex-start; padding-top: 8vh; }
.v-a .beat[data-pos="bottom"] { align-items: flex-end; padding-bottom: 8vh; }
.v-a .hero-num { font-size: clamp(72px, 16vw, 160px); font-weight: 700;
  letter-spacing: -0.04em; line-height: 1; }
.v-a .handoff { text-align: center; padding: 60px 20px 20px; }
.v-a .handoff h2 { font-size: clamp(24px, 3.5vw, 32px); margin: 0 0 10px; }
.v-a .handoff p { color: var(--text-secondary); max-width: 60ch; margin: 0 auto; }
.v-a .explore { max-width: 1080px; margin: 24px auto 100px; padding: 0 20px;
  display: grid; grid-template-columns: 220px 1fr; gap: 28px; }
.v-a .facets { position: sticky; top: 20px; align-self: start; display: flex;
  flex-direction: column; gap: 16px; }
.v-a .facet label { display: block; font-size: 12px; color: var(--muted);
  margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }
.v-a .facet select { width: 100%; padding: 7px 8px; border-radius: 7px;
  border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); }
.v-a .toggle { display: flex; gap: 6px; }
.v-a .toggle button { flex: 1; padding: 7px; border-radius: 7px; border: 1px solid var(--border);
  background: var(--surface-1); color: var(--text-primary); cursor: pointer; font-size: 13px; }
.v-a .toggle button.on { background: var(--ai); color: #fff; border-color: var(--ai); }
.v-a .count { font-size: 13px; color: var(--muted); margin-top: 4px; }
.v-a .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap: 12px; align-content: start; }
.v-a .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px; }
.v-a .card a { color: var(--text-primary); font-weight: 600; text-decoration: none; font-size: 14px; }
.v-a .card a:hover { text-decoration: underline; }
.v-a .card .desc { font-size: 12.5px; color: var(--text-secondary); margin: 6px 0; height: 3.2em; overflow: hidden; }
.v-a .card .meta { font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; }
.v-a .card .ai-pill { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 999px;
  background: color-mix(in srgb, var(--ai) 18%, transparent); color: var(--ai); font-weight: 600; }

/* ================= VARIANT B — editorial split ================= */
.v-b .story { max-width: 1160px; margin: 0 auto; padding: 40px 20px 0;
  display: grid; grid-template-columns: 1fr 1fr; gap: 60px; }
.v-b .narrative { padding-top: 6vh; }
.v-b .step { min-height: 78vh; display: flex; flex-direction: column; justify-content: center;
  opacity: .3; transition: opacity .3s; border-left: 3px solid transparent; padding-left: 20px; }
.v-b .step.active { opacity: 1; border-left-color: var(--ai); }
.v-b .step h3 { font-size: clamp(20px, 2.6vw, 28px); margin: 0 0 10px; letter-spacing: -0.01em; }
.v-b .step p { color: var(--text-secondary); max-width: 46ch; margin: 0; }
.v-b .visual { position: sticky; top: 0; height: 100vh; display: flex; align-items: center; }
.v-b .visual-inner { width: 100%; background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 12px; padding: 24px; }
.v-b .explore { max-width: 1160px; margin: 40px auto 100px; padding: 0 20px; }
.v-b .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
.v-b .toolbar select { padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--plane); color: var(--text-primary); }
.v-b .toolbar .spacer { flex: 1; }
.v-b .toolbar .count { font-size: 13px; color: var(--muted); }
.v-b table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.v-b th, .v-b td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--grid); }
.v-b th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase;
  letter-spacing: .03em; cursor: pointer; user-select: none; }
.v-b th:hover { color: var(--text-primary); }
.v-b td.num, .v-b th.num { text-align: right; font-variant-numeric: tabular-nums; }
.v-b td a { color: var(--text-primary); text-decoration: none; font-weight: 600; }
.v-b td a:hover { text-decoration: underline; }
.v-b .ai-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

/* ================= VARIANT C — compact tabbed ================= */
.v-c .wrap { max-width: 860px; margin: 0 auto; padding: 0 20px 100px; }
.v-c header { padding: 60px 0 10px; }
.v-c h1 { font-size: clamp(28px, 5vw, 42px); margin: 0 0 14px; letter-spacing: -0.02em; }
.v-c .stat-row { display: flex; gap: 14px; flex-wrap: wrap; margin: 24px 0 40px; }
.v-c .stat { flex: 1 1 160px; background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px; }
.v-c .stat .n { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.v-c .stat .l { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.v-c .callout { display: flex; gap: 16px; align-items: flex-start; margin: 34px 0;
  padding: 16px 18px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; }
.v-c .callout .n { font-size: 42px; font-weight: 700; color: var(--ai); letter-spacing: -0.03em; white-space: nowrap; }
.v-c .callout p { margin: 0; color: var(--text-secondary); align-self: center; }
.v-c .tabs { display: flex; gap: 4px; margin: 44px 0 0; border-bottom: 1px solid var(--border); }
.v-c .tab { padding: 9px 16px; font-size: 14px; color: var(--muted); cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px; }
.v-c .tab.on { color: var(--text-primary); border-bottom-color: var(--ai); font-weight: 600; }
.v-c .tabpane { padding: 20px 0; }
.v-c .mini-list { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.v-c .mini-list li { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px;
  padding: 8px 10px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; }
.v-c .mini-list a { color: var(--text-primary); font-weight: 600; text-decoration: none; }
.v-c .mini-list a:hover { text-decoration: underline; }
.v-c .mini-list .d { color: var(--muted); font-size: 11.5px; }
</style>
</head>
<body>
<div id="root" class="loading">Loading data…</div>
<div class="tooltip" id="tip"></div>
<div id="switcher"></div>

<script>
const F = new Intl.NumberFormat('en-US');
const tip = document.getElementById('tip');
function showTip(html, e) {
  tip.innerHTML = html; tip.style.opacity = '1';
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY - r.height - 10;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y < 8) y = e.clientY + 18;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const hideTip = () => tip.style.opacity = '0';
const svgEl = (tag, attrs = {}, kids = []) => {
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  for (const c of [].concat(kids)) n.append(c);
  return n;
};
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); return Math.ceil(v / p * 2) / 2 * p; }

function lineChart(pts, { width = 760, height = 300, yMax, yFmt = v => v, tipFmt, stroke = 'var(--ai)' } = {}) {
  const L = 46, R = 16, T = 14, B = 34;
  const max = yMax ?? niceMax(Math.max(...pts.map(p => p.y)));
  const plotW = width - L - R, plotH = height - T - B;
  const X = i => L + (pts.length === 1 ? plotW / 2 : plotW * i / (pts.length - 1));
  const Y = v => T + plotH * (1 - v / max);
  const svg = svgEl('svg', { viewBox: `0 0 ${width} ${height}`, role: 'img' });
  for (let i = 0; i <= 4; i++) {
    const y = T + plotH * i / 4, v = max * (1 - i / 4);
    svg.append(svgEl('line', { x1: L, y1: y, x2: width - R, y2: y, class: 'gridline' }));
    svg.append(svgEl('text', { x: L - 10, y: y + 4, class: 'tick', 'text-anchor': 'end' }, [document.createTextNode(yFmt(v))]));
  }
  svg.append(svgEl('line', { x1: L, y1: T + plotH, x2: width - R, y2: T + plotH, class: 'baseline' }));
  svg.append(svgEl('path', { d: pts.map((p, i) => `${i ? 'L' : 'M'}${X(i)},${Y(p.y)}`).join(' '),
    fill: 'none', stroke, 'stroke-width': 3, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
  pts.forEach((p, i) => {
    svg.append(svgEl('text', { x: X(i), y: height - 12, class: 'tick', 'text-anchor': 'middle' }, [document.createTextNode(p.x)]));
    const dot = svgEl('circle', { cx: X(i), cy: Y(p.y), r: 5,
      fill: p.partial ? 'var(--surface-1)' : stroke, stroke, 'stroke-width': 2 });
    svg.append(dot);
    const hit = svgEl('circle', { cx: X(i), cy: Y(p.y), r: 16, fill: 'transparent' });
    hit.addEventListener('mousemove', e => showTip(tipFmt(p), e));
    hit.addEventListener('mouseleave', hideTip);
    svg.append(hit);
  });
  return svg;
}

function barChart(rows, { unit = '', width = 700, labelW = 150, barH = 24, gap = 8, color } = {}) {
  const max = niceMax(Math.max(...rows.map(r => r[1])));
  const plotW = width - labelW - 60;
  const height = rows.length * (barH + gap) - gap;
  const svg = svgEl('svg', { viewBox: `0 0 ${width} ${height + 24}`, role: 'img' });
  rows.forEach((r, i) => {
    const y = i * (barH + gap);
    const w = Math.max(2, plotW * r[1] / max);
    svg.append(svgEl('text', { x: labelW - 10, y: y + barH / 2 + 4, class: 'bar-value', 'text-anchor': 'end', fill: 'var(--text-primary)' }, [document.createTextNode(r[0])]));
    const bar = svgEl('rect', { x: labelW, y, width: w, height: barH, rx: 4, fill: r[2] || color || 'var(--series-1)', style: 'cursor:pointer' });
    bar.addEventListener('mousemove', e => showTip(`<strong>${r[0]}</strong><br><span class="t-sub">${F.format(r[1])} ${unit}</span>`, e));
    bar.addEventListener('mouseleave', hideTip);
    if (r[3]) bar.addEventListener('click', r[3]);
    svg.append(bar);
    svg.append(svgEl('text', { x: labelW + w + 8, y: y + barH / 2 + 4, class: 'bar-value' }, [document.createTextNode(F.format(r[1]))]));
  });
  return svg;
}

function stackedAiBar(rows, { width = 700, labelW = 150, barH = 24, gap = 8 } = {}) {
  const max = niceMax(Math.max(...rows.map(r => r.total)));
  const plotW = width - labelW - 60;
  const height = rows.length * (barH + gap) - gap;
  const svg = svgEl('svg', { viewBox: `0 0 ${width} ${height + 24}`, role: 'img' });
  rows.forEach((r, i) => {
    const y = i * (barH + gap);
    const wTot = Math.max(2, plotW * r.total / max);
    const wAi = wTot * (r.ai / r.total);
    svg.append(svgEl('text', { x: labelW - 10, y: y + barH / 2 + 4, class: 'bar-value', 'text-anchor': 'end', fill: 'var(--text-primary)' }, [document.createTextNode(r.label)]));
    const base = svgEl('rect', { x: labelW, y, width: wTot, height: barH, rx: 4, fill: 'var(--nonai)', opacity: .35 });
    const ai = svgEl('rect', { x: labelW, y, width: wAi, height: barH, rx: 4, fill: 'var(--ai)' });
    [base, ai].forEach(el => {
      el.addEventListener('mousemove', e => showTip(`<strong>${r.label}</strong><br><span class="t-sub">${(100*r.ai/r.total).toFixed(0)}% AI · ${F.format(r.total)} repos</span>`, e));
      el.addEventListener('mouseleave', hideTip);
      svg.append(el);
    });
    svg.append(svgEl('text', { x: labelW + wTot + 8, y: y + barH / 2 + 4, class: 'bar-value' }, [document.createTextNode((100*r.ai/r.total).toFixed(0) + '%')]));
  });
  return svg;
}

Promise.all([
  fetch('data/summary.json').then(r => r.json()),
  fetch('data/taxonomy.json').then(r => r.json()),
  fetch('data/top/all.json').then(r => r.json())
]).then(([summary, tax, top]) => {
  const label = (axis, slug) => tax[axis]?.[slug]?.label || slug.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
  const isAi = repo => tax.domain?.[repo.domain]?.group === 'ai';
  top.forEach(r => r._ai = isAi(r));
  boot({ summary, tax, top, label });
}).catch(e => {
  document.getElementById('root').innerHTML =
    `<p class="loading">Could not load data/*.json — run <code>python3 -m http.server</code> from site/.<br><br>${e}</p>`;
});

function boot({ summary, tax, top, label }) {
  const params = new URLSearchParams(location.search);
  const variants = ['A', 'B', 'C'];
  const names = { A: 'Cinematic scroll', B: 'Editorial split-pane', C: 'Compact tabbed' };
  let current = variants.includes(params.get('variant')) ? params.get('variant') : 'A';

  const root = document.getElementById('root');
  function render() {
    root.className = '';
    root.innerHTML = '';
    root.classList.add('v-' + current.toLowerCase());
    ({ A: renderA, B: renderB, C: renderC })[current](root, { summary, tax, top, label });
  }
  function setVariant(v) {
    current = v;
    const u = new URL(location); u.searchParams.set('variant', v);
    history.replaceState(null, '', u);
    render();
    mountSwitcher();
  }
  function mountSwitcher() {
    const bar = document.getElementById('switcher');
    bar.innerHTML = `<button id="prev">←</button><span class="label">${current} — <b>${names[current]}</b></span><button id="next">→</button>`;
    const idx = variants.indexOf(current);
    bar.querySelector('#prev').onclick = () => setVariant(variants[(idx - 1 + variants.length) % variants.length]);
    bar.querySelector('#next').onclick = () => setVariant(variants[(idx + 1) % variants.length]);
  }
  document.addEventListener('keydown', e => {
    const t = e.target;
    if (t.matches('input,textarea,select,[contenteditable]')) return;
    const idx = variants.indexOf(current);
    if (e.key === 'ArrowLeft') setVariant(variants[(idx - 1 + variants.length) % variants.length]);
    if (e.key === 'ArrowRight') setVariant(variants[(idx + 1) % variants.length]);
  });
  render();
  mountSwitcher();
}

/* ============================================================
   VARIANT A — Cinematic scroll: full-bleed pinned chart with
   fading narrative beats on top, hard cut into a sidebar-facet
   explorer with card grid.
   ============================================================ */
function renderA(root, { summary, top, label }) {
  const ai = summary.ai_by_year;
  const latest = ai[ai.length - 1], base = ai[0];

  root.innerHTML = `
    <div class="story">
      <div class="pin-wrap">
        <div class="pin">
          <div class="pin-chart" id="a-chart"></div>
        </div>
        <div class="beat" data-pos="top" style="top:0"><div class="beat-text">
          In <em>${base.year}</em>, about <em>1 in 7</em> new repositories that broke out were AI-related.</div></div>
        <div class="beat" style="top:100vh"><div class="beat-text hero-num">${latest.pct}%</div></div>
        <div class="beat" data-pos="bottom" style="top:200vh"><div class="beat-text">
          By <em>${latest.year}</em>, when a new project breaks 50 stars, it's a <em>coin-flip</em> whether it's AI.</div></div>
      </div>
      <div class="handoff">
        <h2>What are people actually building with it?</h2>
        <p>Filter the ${top.length} highest-starred repos in the dataset by category, domain, language, and AI-relatedness.</p>
      </div>
      <div class="explore">
        <div class="facets">
          <div class="facet"><label>Category</label><select id="f-cat"><option value="">All</option></select></div>
          <div class="facet"><label>Language</label><select id="f-lang"><option value="">All</option></select></div>
          <div class="facet"><label>AI-related</label>
            <div class="toggle">
              <button data-v="">All</button><button data-v="1">AI</button><button data-v="0">Non-AI</button>
            </div>
          </div>
          <div class="count" id="a-count"></div>
        </div>
        <div class="cards" id="a-cards"></div>
      </div>
    </div>`;

  root.querySelector('#a-chart').append(lineChart(
    ai.map(r => ({ x: r.year, y: r.pct, partial: r.partial, ...r })),
    { yMax: 60, yFmt: v => v.toFixed(0) + '%', width: 640, height: 320,
      tipFmt: p => `<strong>${p.x}</strong><br><span class="t-sub">${p.pct}% AI-related</span>` }));

  // scroll-driven beat activation
  const beats = [...root.querySelectorAll('.beat')];
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => e.target.classList.toggle('active', e.isIntersecting));
  }, { threshold: 0.5 });
  beats.forEach(b => io.observe(b));

  // facets
  const catSel = root.querySelector('#f-cat'), langSel = root.querySelector('#f-lang');
  [...new Set(top.map(r => r.category))].sort().forEach(c => catSel.add(new Option(label('category', c), c)));
  [...new Set(top.map(r => r.language))].sort().forEach(l => langSel.add(new Option(l, l)));
  let aiFilter = '';
  root.querySelectorAll('.toggle button').forEach(b => b.onclick = () => {
    aiFilter = b.dataset.v;
    root.querySelectorAll('.toggle button').forEach(x => x.classList.toggle('on', x === b));
    draw();
  });
  catSel.onchange = draw; langSel.onchange = draw;
  function draw() {
    const rows = top.filter(r =>
      (!catSel.value || r.category === catSel.value) &&
      (!langSel.value || r.language === langSel.value) &&
      (aiFilter === '' || (aiFilter === '1') === r._ai));
    root.querySelector('#a-count').textContent = `${rows.length} of ${top.length} repos`;
    root.querySelector('#a-cards').innerHTML = rows.map(r => `
      <div class="card">
        <a href="${r.url}" target="_blank" rel="noopener">${r.full_name}</a>
        ${r._ai ? '<span class="ai-pill">AI</span>' : ''}
        <div class="desc">${(r.description||'').replace(/</g,'&lt;')}</div>
        <div class="meta"><span>${r.language||'—'}</span><span>★ ${F.format(r.stars)}</span></div>
      </div>`).join('');
  }
  draw();
}

/* ============================================================
   VARIANT B — Editorial split-pane: sticky right-hand chart,
   left-hand narrative steps swap it via IntersectionObserver.
   Explorer = toolbar + sortable dense table.
   ============================================================ */
function renderB(root, { summary, top, label }) {
  const ai = summary.ai_by_year;
  const cats = Object.entries(summary.by_category).filter(([k]) => k !== 'unclassified').sort((a,b)=>b[1]-a[1]);

  root.innerHTML = `
    <div class="story">
      <div class="narrative">
        <div class="step active" data-chart="arc">
          <h3>1 in 7, five years ago</h3>
          <p>In ${ai[0].year}, roughly ${ai[0].pct}% of newly created repositories that reached 50 stars were AI-related.</p>
        </div>
        <div class="step" data-chart="arc-late">
          <h3>Now it's a coin-flip</h3>
          <p>By ${ai[ai.length-1].year}, that number is ${ai[ai.length-1].pct}%. The inflection point was 2023 — the first full year after ChatGPT.</p>
        </div>
        <div class="step" data-chart="cats">
          <h3>Most of it is plumbing</h3>
          <p>Libraries and SDKs alone outnumber web apps, CLI tools, and dev tooling combined. Open source is mostly parts, not products.</p>
        </div>
      </div>
      <div class="visual"><div class="visual-inner" id="b-chart"></div></div>
    </div>
    <div class="explore">
      <div class="toolbar">
        <select id="f-cat"><option value="">All categories</option></select>
        <select id="f-lang"><option value="">All languages</option></select>
        <select id="f-ai"><option value="">AI + non-AI</option><option value="1">AI only</option><option value="0">Non-AI only</option></select>
        <span class="spacer"></span>
        <span class="count" id="b-count"></span>
      </div>
      <table>
        <thead><tr>
          <th data-k="full_name">Repo</th><th data-k="category">Category</th>
          <th data-k="language">Language</th><th class="num" data-k="stars">Stars</th>
        </tr></thead>
        <tbody id="b-rows"></tbody>
      </table>
    </div>`;

  function drawChart(which) {
    const host = root.querySelector('#b-chart');
    host.innerHTML = '';
    if (which === 'arc' || which === 'arc-late') {
      host.append(lineChart(ai.map(r => ({ x: r.year, y: r.pct, partial: r.partial, ...r })),
        { yMax: 60, yFmt: v => v.toFixed(0)+'%', width: 480, height: 340,
          tipFmt: p => `<strong>${p.x}</strong><br><span class="t-sub">${p.pct}% AI</span>` }));
    } else {
      host.append(barChart(cats.map(([k,v]) => [label('category',k), v]), { unit: 'repos', width: 480 }));
    }
  }
  drawChart('arc');
  const steps = [...root.querySelectorAll('.step')];
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        steps.forEach(s => s.classList.remove('active'));
        e.target.classList.add('active');
        drawChart(e.target.dataset.chart);
      }
    });
  }, { threshold: 0.6 });
  steps.forEach(s => io.observe(s));

  // explorer table
  const catSel = root.querySelector('#f-cat'), langSel = root.querySelector('#f-lang'), aiSel = root.querySelector('#f-ai');
  [...new Set(top.map(r => r.category))].sort().forEach(c => catSel.add(new Option(label('category',c), c)));
  [...new Set(top.map(r => r.language))].sort().forEach(l => langSel.add(new Option(l, l)));
  let sortKey = 'stars', sortDir = -1;
  function draw() {
    let rows = top.filter(r =>
      (!catSel.value || r.category === catSel.value) &&
      (!langSel.value || r.language === langSel.value) &&
      (aiSel.value === '' || (aiSel.value === '1') === r._ai));
    rows = rows.slice().sort((a,b) => (a[sortKey] > b[sortKey] ? 1 : -1) * sortDir);
    root.querySelector('#b-count').textContent = `${rows.length} repos`;
    root.querySelector('#b-rows').innerHTML = rows.map(r => `
      <tr>
        <td><span class="ai-dot" style="background:${r._ai ? 'var(--ai)' : 'var(--nonai)'}"></span>
          <a href="${r.url}" target="_blank" rel="noopener">${r.full_name}</a></td>
        <td>${label('category', r.category)}</td>
        <td>${r.language||'—'}</td>
        <td class="num">${F.format(r.stars)}</td>
      </tr>`).join('');
  }
  [catSel, langSel, aiSel].forEach(s => s.onchange = draw);
  root.querySelectorAll('th[data-k]').forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    sortDir = (sortKey === k) ? -sortDir : -1;
    sortKey = k;
    draw();
  });
  draw();
}

/* ============================================================
   VARIANT C — Compact tabbed: short stat-forward narrative,
   quick handoff to a tabbed explorer (one dimension per tab).
   ============================================================ */
function renderC(root, { summary, top, label }) {
  const ai = summary.ai_by_year;
  const latest = ai[ai.length-1], base = ai[0];
  const dims = {
    Category: Object.entries(summary.by_category).filter(([k])=>k!=='unclassified').sort((a,b)=>b[1]-a[1]),
    Domain: Object.entries(summary.by_domain).filter(([k])=>!['unclassified','unknown','other'].includes(k)).sort((a,b)=>b[1]-a[1]).slice(0,10),
    Language: Object.entries(summary.by_language).filter(([k])=>k!=='unknown').sort((a,b)=>b[1]-a[1]).slice(0,10),
  };

  root.innerHTML = `
    <div class="wrap">
      <header>
        <h1>What people are building on GitHub</h1>
        <div class="callout">
          <div class="n">${latest.pct}%</div>
          <p>of repos that broke out in ${latest.year} are AI-related — up from ${base.pct}% in ${base.year}. It's now a coin-flip.</p>
        </div>
        <div class="stat-row">
          <div class="stat"><div class="n">${F.format(summary.total_repos)}</div><div class="l">repos analyzed</div></div>
          <div class="stat"><div class="n">${(100*summary.by_category['library-sdk']/summary.total_repos).toFixed(0)}%</div><div class="l">are libraries / SDKs</div></div>
          <div class="stat"><div class="n">14 × 29</div><div class="l">category × domain taxonomy</div></div>
        </div>
      </header>
      <div class="tabs" id="c-tabs"></div>
      <div class="tabpane" id="c-pane"></div>
    </div>`;

  const tabsEl = root.querySelector('#c-tabs');
  const names = Object.keys(dims);
  let activeTab = names[0];
  function drawTabs() {
    tabsEl.innerHTML = names.map(n => `<div class="tab ${n===activeTab?'on':''}" data-n="${n}">${n}</div>`).join('');
    tabsEl.querySelectorAll('.tab').forEach(t => t.onclick = () => { activeTab = t.dataset.n; drawTabs(); drawPane(); });
  }
  function drawPane() {
    const pane = root.querySelector('#c-pane');
    pane.innerHTML = '';
    const axis = activeTab.toLowerCase();
    const rows = dims[activeTab];
    const chartRows = rows.map(([k,v]) => [axis==='language'?k:label(axis,k), v, null, () => selectSlice(axis, k)]);
    pane.append(barChart(chartRows, { unit: 'repos', width: 780, labelW: 170 }));
    const list = document.createElement('ul');
    list.className = 'mini-list';
    list.id = 'c-list';
    pane.append(list);
    selectSlice(axis, rows[0][0]);
  }
  function selectSlice(axis, key) {
    const list = root.querySelector('#c-list');
    const rows = top.filter(r => (axis==='language' ? r.language : r[axis]) === key).sort((a,b)=>b.stars-a.stars).slice(0,8);
    list.innerHTML = rows.map(r => `
      <li><span><a href="${r.url}" target="_blank" rel="noopener">${r.full_name}</a>
        <span class="d">${r._ai ? 'AI · ' : ''}${r.language||'—'}</span></span><span>★ ${F.format(r.stars)}</span></li>`).join('')
      || '<li class="d">No repos in top 100 for this slice.</li>';
  }
  drawTabs();
  drawPane();
}
</script>
</body>
